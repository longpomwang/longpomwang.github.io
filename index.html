<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쇼핑픽 — 영상 속 그 상품</title>
<meta name="description" content="쇼핑픽 쇼츠에 나온 상품을 상품번호로 찾으세요">
<link rel="icon" href="logo.png">
<style>
:root{--y:#FFD600;--k:#111;--r:#E8202A;--bg:#FFFBEA;--line:#eee2a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--k);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{background:var(--y);padding:22px 16px 18px;text-align:center;border-bottom:3px solid var(--k)}
header img{width:84px;height:84px;border-radius:50%;border:3px solid var(--k);background:var(--y)}
header h1{margin:8px 0 2px;font-size:26px;letter-spacing:-.5px}header h1 b{color:var(--r)}
header p{margin:0;font-size:14px}
.find{max-width:640px;margin:16px auto 6px;padding:0 16px}
.find input{width:100%;font-size:18px;padding:14px 16px;border:3px solid var(--k);border-radius:14px;outline:none}
.find small{display:block;margin-top:6px;color:#666;font-size:13px}
main{max-width:640px;margin:0 auto;padding:10px 16px 28px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:flex;flex-direction:column;background:#fff;border:2px solid var(--k);border-radius:16px;overflow:hidden;
  color:inherit;text-decoration:none;box-shadow:3px 3px 0 var(--k)}
.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--k)}
.thumb{position:relative;aspect-ratio:1/1;background:#fff}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{display:flex;align-items:center;justify-content:center;height:100%;font-size:42px}
.code{position:absolute;left:8px;top:8px;background:var(--k);color:var(--y);font-weight:800;font-size:13px;
  padding:4px 8px;border-radius:8px}
.body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{margin:0;font-size:14px;line-height:1.35;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.price{margin:0;font-size:16px;font-weight:800}
.buy{margin-top:auto;background:var(--y);border:2px solid var(--k);border-radius:10px;text-align:center;
  font-weight:800;font-size:13px;padding:7px 4px}
.empty{grid-column:1/-1;text-align:center;font-size:16px;padding:40px 0}
footer{max-width:640px;margin:0 auto;padding:0 16px 32px;color:#777;font-size:12px;line-height:1.5;text-align:center}
@media(min-width:560px){main{grid-template-columns:1fr 1fr 1fr}}
</style></head><body>
<header><img src="logo.png" alt="쇼핑픽"><h1>쇼핑<b>픽</b></h1><p>영상 속 그 상품, 번호로 찾으세요</p></header>
<div class="find"><input id="q" inputmode="text" placeholder="상품번호 (예: SP0001) 또는 이름" autocomplete="off">
  <small>쇼츠 화면 위쪽 노란 칸에 상품번호가 있어요</small></div>
<main id="list"><a class="card" href="https://link.coupang.com/a/hFCmtEOjcG" target="_blank" rel="sponsored noopener" data-code="SP0003" data-name="조셉조셉 헬릭스 포테이토 라이서 (감자으깨기)">
  <div class="thumb"><img src="img/SP0003.jpg" alt="" loading="lazy"><span class="code">SP0003</span></div>
  <div class="body"><p class="name">조셉조셉 헬릭스 포테이토 라이서 (감자으깨기)</p><p class="price">44,000원</p><span class="buy">쿠팡에서 보기 →</span></div>
</a>
<a class="card" href="https://link.coupang.com/a/hFCwKfYhzw" target="_blank" rel="sponsored noopener" data-code="SP0002" data-name="다용도 만능채칼 야채 슬라이서 (손보호대·수납통 일체형, 크림색)">
  <div class="thumb"><img src="img/SP0002.jpg" alt="" loading="lazy"><span class="code">SP0002</span></div>
  <div class="body"><p class="name">다용도 만능채칼 야채 슬라이서 (손보호대·수납통 일체형, 크림색)</p><p class="price">28,600원</p><span class="buy">쿠팡에서 보기 →</span></div>
</a>
</main>
<footer>이 페이지의 링크로 구매하면 쿠팡 파트너스 활동으로 일정액의 수수료를 받을 수 있습니다.<br>가격·재고는 쿠팡에서 바뀔 수 있습니다.</footer>
<script>
const q=document.getElementById('q');
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase().replace(/\s/g,'');
  document.querySelectorAll('.card').forEach(c=>{const hit=!v||c.dataset.code.toLowerCase().includes(v)||c.dataset.name.replace(/\s/g,'').includes(v);
  c.style.display=hit?'':'none';});});
</script>
</body></html>
